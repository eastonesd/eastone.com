<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東石系統</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<!-- iOS「加入主畫面」專用設定：Android/桌面看 manifest.json，iOS Safari 只認得下面這幾行 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="理賠文件">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#121D33;
    --slate:#2E4370;
    --paper:#F6F3EC;
    --paper-dim:#EDE8DC;
    --seal:#A63D40;
    --gold:#B8892B;
    --ink:#2A2A26;
    --line:#D8D0BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    opacity:0.18;
    z-index:0;
  }

  header{
    position:relative;
    z-index:2;
    background:var(--navy);
    color:var(--paper);
    padding:22px clamp(20px,4vw,56px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:3px solid var(--gold);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brand-mark{
    width:38px;height:38px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    color:var(--gold);
    font-size:16px;
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:clamp(18px,2.4vw,24px);
    margin:0;
    letter-spacing:0.04em;
  }
  .brand span{
    display:block;
    font-size:11px;
    letter-spacing:0.28em;
    color:#C9BFA6;
    margin-top:3px;
  }

  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    background:var(--navy-deep);
    border-radius:999px;
    padding:4px;
    gap:2px;
    border:1px solid rgba(184,137,43,0.5);
  }
  nav.tabs button{
    font-family:'Noto Serif TC', serif;
    font-size:14px;
    letter-spacing:0.08em;
    font-weight:700;
    padding:9px 22px;
    border:none;
    border-radius:999px;
    background:transparent;
    color:#B9C2D6;
    cursor:pointer;
    transition:all .25s ease;
  }
  nav.tabs button.active{
    background:var(--gold);
    color:var(--navy-deep);
  }
  nav.tabs button:not(.active):hover{
    color:var(--paper);
  }

  main{
    position:relative;
    z-index:2;
    max-width:1180px;
    margin:0 auto;
    padding:clamp(28px,4vw,52px) clamp(20px,4vw,56px) 80px;
  }

  .page-title{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:6px;
  }
  .page-title h2{
    font-family:'Noto Serif TC', serif;
    font-size:clamp(24px,3vw,32px);
    margin:0;
    color:var(--navy);
  }
  .page-title .count{
    font-size:13px;
    color:#7A7362;
    letter-spacing:0.05em;
  }
  .page-sub{
    color:#5B5647;
    font-size:14.5px;
    margin:0 0 30px;
    line-height:1.7;
    max-width:640px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:16px;
  }

  .card{
    position:relative;
    background:#FFFDF8;
    border:1px solid var(--line);
    border-radius:6px;
    padding:20px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:5px;height:100%;
    background:var(--slate);
    opacity:0.7;
  }
  .card .idx{
    font-family:'Noto Serif TC', serif;
    font-size:11px;
    color:#A79A78;
    letter-spacing:0.12em;
  }
  .card h3{
    font-family:'Noto Serif TC', serif;
    font-size:17.5px;
    font-weight:700;
    margin:0;
    color:var(--navy);
    line-height:1.4;
  }
  .dl-btn{
    position:relative;
    align-self:flex-start;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:0.03em;
    background:var(--navy);
    color:var(--paper);
    border:none;
    padding:10px 16px;
    border-radius:4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s ease, transform .1s ease;
  }
  .dl-btn:hover{ background:var(--slate); }
  .dl-btn:active{ transform:translateY(1px); }
  .dl-btn svg{width:14px;height:14px;flex-shrink:0;}

  .dl-btn .stamp{
    position:absolute;
    right:-6px; top:-6px;
    width:30px;height:30px;
    border:2px solid var(--seal);
    border-radius:50%;
    color:var(--seal);
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:11px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,253,248,0.95);
    opacity:0;
    transform:scale(2.4) rotate(-18deg);
    pointer-events:none;
  }
  .dl-btn.stamped .stamp{
    animation: stampDown .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampDown{
    0%{ opacity:0; transform:scale(2.6) rotate(-18deg); }
    55%{ opacity:1; transform:scale(0.92) rotate(-10deg); }
    75%{ opacity:1; transform:scale(1.06) rotate(-10deg); }
    100%{ opacity:0; transform:scale(1.0) rotate(-10deg); transition-delay:.2s; }
  }

  .status-note{
    margin-top:6px;
    font-size:12px;
    color:#8A8368;
    min-height:16px;
  }

  /* 契變頁 */
  .empty-state{
    border:1px dashed var(--line);
    border-radius:8px;
    background:#FFFDF8;
    padding:64px 40px;
    text-align:center;
    max-width:560px;
    margin:40px auto 0;
  }
  .empty-state .glyph{
    width:52px;height:52px;
    margin:0 auto 20px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    color:var(--gold);
    font-size:20px;
  }
  .empty-state h3{
    font-family:'Noto Serif TC', serif;
    color:var(--navy);
    font-size:19px;
    margin:0 0 10px;
  }
  .empty-state p{
    color:#6B6656;
    font-size:14px;
    line-height:1.8;
    margin:0;
  }

  .hidden{ display:none !important; }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:18px;
    font-size:12px;
    color:#9A927A;
    border-top:1px solid var(--line);
  }

  @media (max-width:560px){
    header{ flex-direction:column; align-items:flex-start; gap:14px; }
    nav.tabs{ align-self:stretch; }
    nav.tabs button{ flex:1; }
  }

  :focus-visible{
    outline:2px solid var(--gold);
    outline-offset:2px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">ES</div>
    <div>
      <h1>東石系統</h1>
      <span>EASTONE SYSTEM</span>
    </div>
  </div>
  <nav class="tabs">
    <button id="tab-claim" class="active" onclick="showPage('claim')">理賠</button>
    <button id="tab-endorse" onclick="showPage('endorse')">契變</button>
    <button id="tab-policy" onclick="location.href='policies/index.html'">車險管理</button>
    <button id="tab-clients" onclick="location.href='clients/index.html'">客戶資料</button>
    <button id="tab-market" onclick="location.href='market/index.html'">財經日報</button>
  </nav>
</header>

<main>
  <!-- 理賠頁 -->
  <section id="page-claim">
    <div class="page-title">
      <h2>理賠申請文件</h2>
      <span class="count">共 20 家壽險公司 + 1 家產險公司</span>
    </div>
    <p class="page-sub">點選公司名稱下方的按鈕，即可下載該公司最新版理賠申請書 PDF 檔案。</p>
    <div class="grid" id="claim-grid"></div>
  </section>

  <!-- 契變頁 -->
  <section id="page-endorse" class="hidden">
    <div class="page-title">
      <h2>契約變更文件</h2>
    </div>
    <div class="empty-state">
      <div class="glyph">契</div>
      <h3>文件準備中</h3>
      <p>契約變更（契變）申請文件尚未上架，<br>待各公司文件蒐集完成後將於此頁面提供下載。</p>
    </div>
  </section>
</main>

<footer>僅供內部業務使用．請下載後確認為最新版本文件</footer>

<script>
  // 20 家壽險公司資料
  // filename 對應 pdfs 資料夾中的檔案，請將實際 PDF 檔案放入 pdfs/ 資料夾並改成對應檔名
  const companies = [
    { name:"國泰人壽(含國寶、幸福)", file:"cathay.pdf" },
    { name:"富邦人壽(含ING安泰、喬治亞、花旗)", file:"fubon.pdf" },
    { name:"南山人壽(含朝陽、興農)", file:"nanshan.pdf" },
    { name:"新光人壽(含保德信、台新)", file:"shinkong.pdf" },
    { name:"台灣人壽(含中國信託、大都會)", file:"taiwanlife.pdf" },
    { name:"三商美邦人壽", file:"massmutual.pdf" },
    { name:"全球人壽(含國華、全美)", file:"tglife.pdf" },
    { name:"保誠人壽", file:"prudential.pdf" },
    { name:"遠雄人壽(含蘇黎世、中興)", file:"farglory.pdf" },
    { name:"元大人壽(含紐約)", file:"yuanta.pdf" },
    { name:"安聯人壽(含匯豐、統一)", type:"link", link:"https://www.allianz.com.tw/zh_TW/download-zone/claim-forms.html" },
    { name:"第一金人壽(含第一英傑華)", file:"firstlife.pdf" },
    { name:"合作金庫人壽", file:"tacoop.pdf" },
    { name:"台銀人壽(含中央)", file:"botlife.pdf" },
    { name:"宏泰人壽", file:"hontai.pdf" },
    { name:"中華郵政壽險", file:"postlife.pdf" },
    { name:"凱基人壽(含中國、保誠、慶豐、第一、瑞泰、華僑)", file:"kgi.pdf" },
    { name:"友邦人壽(含美國)", file:"aia.pdf" },
    { name:"安達人壽(含康健、中泰)", file:"chubb.pdf" },
    { name:"法國巴黎人壽", file:"cardi.pdf" },
    { name:"富邦產物車險", file:"fuboncar.pdf" },
    { name:"富邦產物個險/旅平險", file:"fubonper.pdf"}
  ];

  const grid = document.getElementById('claim-grid');

  companies.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';

    const idx = document.createElement('div');
    idx.className = 'idx';
    idx.textContent = String(i+1).padStart(2,'0');

    const h3 = document.createElement('h3');
    h3.textContent = c.name;

    const isLink = c.type === 'link';
    const btn = document.createElement('button');
    btn.className = 'dl-btn';
    btn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      ${isLink ? '前往理賠文件' : '下載理賠文件'}
      <span class="stamp">${isLink ? '已開啟' : '已下載'}</span>
    `;

    const note = document.createElement('div');
    note.className = 'status-note';

    btn.addEventListener('click', () => {
      if (isLink) {
        // 直接導向該連結（開新分頁）
        window.open(c.link, '_blank');
      } else {
        // 觸發下載
        const a = document.createElement('a');
        a.href = 'pdfs/' + c.file;
        a.download = c.name + '_理賠申請書.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }

      // 蓋章動畫
      btn.classList.remove('stamped');
      void btn.offsetWidth; // reflow 以重新觸發動畫
      btn.classList.add('stamped');

      note.textContent = isLink
        ? '已於 ' + new Date().toLocaleTimeString('zh-TW', {hour12:false}) + ' 開啟連結'
        : '已於 ' + new Date().toLocaleTimeString('zh-TW', {hour12:false}) + ' 下載';
    });

    card.appendChild(idx);
    card.appendChild(h3);
    card.appendChild(btn);
    card.appendChild(note);
    grid.appendChild(card);
  });

  function showPage(which){
    document.getElementById('page-claim').classList.toggle('hidden', which !== 'claim');
    document.getElementById('page-endorse').classList.toggle('hidden', which !== 'endorse');
    document.getElementById('tab-claim').classList.toggle('active', which === 'claim');
    document.getElementById('tab-endorse').classList.toggle('active', which === 'endorse');
  }
</script>
</body>
</html>
