<style>
  :root{
    --navy:#1B2A4A;
    --navy-deep:#121D33;
    --slate:#2E4370;
    --paper:#F6F3EC;
    --paper-dim:#EDE8DC;
    --seal:#A63D40;
    --gold:#B8892B;
    --ink:#2A2A26;
    --line:#D8D0BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--tc-bg-f6f3ec);
    color:var(--tc-fg-2a2a26);
    font-family:'Noto Sans TC', sans-serif;
    min-height:100vh;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:linear-gradient(var(--tc-bg-d8d0bc) 1px, transparent 1px);
    background-size:100% 42px;
    opacity:0.18;
    z-index:0;
  }

  main{
    position:relative;
    z-index:2;
    max-width:1180px;
    margin:0 auto;
    padding:clamp(28px,4vw,52px) clamp(20px,4vw,56px) 80px;
  }

  .doc-tabs{ display:flex; gap:6px; margin:0 0 18px; padding:4px; border-radius:999px; border:1px solid rgba(184,137,43,.45); width:max-content; max-width:100%; }
  .doc-tabs button{ font:inherit; font-weight:700; padding:8px 22px; border:0; border-radius:999px; background:transparent; color:inherit; cursor:pointer; }
  .doc-tabs button.active{ background:#B8892B; color:#fff; }
  .doc-go{ font:inherit; font-weight:700; padding:10px 18px; border-radius:999px; border:1px solid #B8892B; background:transparent; color:inherit; cursor:pointer; }
  .page-title{
    display:flex;
    align-items:baseline;
    gap:16px;
    margin-bottom:6px;
  }
  .page-title h2{
    font-family:'Noto Serif TC', serif;
    font-size:clamp(24px,3vw,32px);
    margin:0;
    color:var(--tc-fg-1b2a4a);
  }
  .page-title .count{
    font-size:13px;
    color:var(--tc-fg-7a7362);
    letter-spacing:0.05em;
  }
  .page-sub{
    color:var(--tc-fg-5b5647);
    font-size:14.5px;
    margin:0 0 30px;
    line-height:1.7;
    max-width:640px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
    gap:16px;
  }

  .card{
    position:relative;
    background:var(--tc-bg-fffdf8);
    border:1px solid var(--tc-bd-d8d0bc);
    border-radius:6px;
    padding:20px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;
    width:5px;height:100%;
    background:var(--tc-bg-2e4370);
    opacity:0.7;
  }
  .card .idx{
    font-family:'Noto Serif TC', serif;
    font-size:11px;
    color:var(--tc-fg-a79a78);
    letter-spacing:0.12em;
  }
  .card h3{
    font-family:'Noto Serif TC', serif;
    font-size:17.5px;
    font-weight:700;
    margin:0;
    color:var(--tc-fg-1b2a4a);
    line-height:1.4;
  }
  .dl-btn{
    position:relative;
    align-self:flex-start;
    font-family:'Noto Sans TC', sans-serif;
    font-weight:700;
    font-size:13.5px;
    letter-spacing:0.03em;
    background:var(--tc-bg-1b2a4a);
    color:var(--tc-fg-f6f3ec);
    border:none;
    padding:10px 16px;
    border-radius:4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:background .2s ease, transform .1s ease;
  }
  .dl-btn:hover{ background:var(--tc-bg-2e4370); }
  .dl-btn:active{ transform:translateY(1px); }
  .dl-btn svg{width:14px;height:14px;flex-shrink:0;}

  .dl-btn .stamp{
    position:absolute;
    right:-6px; top:-6px;
    width:30px;height:30px;
    border:2px solid var(--tc-bd-a63d40);
    border-radius:50%;
    color:var(--tc-fg-a63d40);
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:11px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,253,248,0.95);
    opacity:0;
    transform:scale(2.4) rotate(-18deg);
    pointer-events:none;
  }
  .dl-btn.stamped .stamp{
    animation: stampDown .55s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampDown{
    0%{ opacity:0; transform:scale(2.6) rotate(-18deg); }
    55%{ opacity:1; transform:scale(0.92) rotate(-10deg); }
    75%{ opacity:1; transform:scale(1.06) rotate(-10deg); }
    100%{ opacity:0; transform:scale(1.0) rotate(-10deg); transition-delay:.2s; }
  }

  .status-note{
    margin-top:6px;
    font-size:12px;
    color:var(--tc-fg-8a8368);
    min-height:16px;
  }

  /* 契變頁 */
  .empty-state{
    border:1px dashed var(--tc-bd-d8d0bc);
    border-radius:8px;
    background:var(--tc-bg-fffdf8);
    padding:64px 40px;
    text-align:center;
    max-width:560px;
    margin:40px auto 0;
  }
  .empty-state .glyph{
    width:52px;height:52px;
    margin:0 auto 20px;
    border:2px solid var(--tc-bd-b8892b);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    color:var(--tc-fg-b8892b);
    font-size:20px;
  }
  .empty-state h3{
    font-family:'Noto Serif TC', serif;
    color:var(--tc-fg-1b2a4a);
    font-size:19px;
    margin:0 0 10px;
  }
  .empty-state p{
    color:var(--tc-fg-6b6656);
    font-size:14px;
    line-height:1.8;
    margin:0;
  }

  .hidden{ display:none !important; }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:18px;
    font-size:12px;
    color:var(--tc-fg-9a927a);
    border-top:1px solid var(--tc-bd-d8d0bc);
  }

  @media (max-width:560px){

  }

  :focus-visible{
    outline:2px solid var(--tc-bd-b8892b);
    outline-offset:2px;
  }
</style>
</head>
<body>

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <img class="ghdr-mark" src="icons/logo.png" alt="東石家族辦公室">
    <div>
      <div class="ghdr-title">東石家族辦公室</div>
      <div class="ghdr-sub">EASTONE FAMILY OFFICE</div>
    </div>
  </div>
  <nav class="ghdr-nav">
    <button id="tab-docs" class="active" onclick="showPage('claim')">文件下載</button>
    <button id="tab-market" onclick="location.href='market/index.html'">財經日報</button>
    <button onclick="location.href='clients/index.html#filelist'">客戶管理</button>
    <button onclick="location.href='stock/index.html'">東石診股</button>
  </nav>
</div>

<main id="docs-main" hidden>
  <!-- 文件下載：理賠／契變／解約 -->
  <nav class="doc-tabs" aria-label="文件類別">
    <button type="button" id="tab-claim" class="active" onclick="showPage('claim')">理賠</button>
    <button type="button" id="tab-endorse" onclick="showPage('endorse')">契變</button>
    <button type="button" id="tab-surrender" onclick="showPage('surrender')">解約</button>
  </nav>
  <!-- 理賠頁 -->
  <section id="page-claim">
    <div class="page-title">
      <h2>理賠申請文件</h2>
      <span class="count">共 20 家壽險公司</span>
    </div>
    <p class="page-sub">點選公司名稱下方的按鈕，即可下載該公司最新版理賠申請書 PDF 檔案。</p>
    <div class="grid" id="claim-grid"></div>
  </section>

  <!-- 契變頁 -->
  <section id="page-endorse" class="hidden">
    <div class="page-title">
      <h2>契約變更文件</h2>
      <span class="count">共 20 家壽險公司</span>
    </div>
    <p class="page-sub">點選公司名稱下方的按鈕，即可下載該公司最新版契約變更申請書 PDF 檔案。</p>
    <div class="grid" id="endorse-grid"></div>
  </section>

  <!-- 解約頁：目前解約文件併在契變申請書裡，之後分離出來再放這裡 -->
  <section id="page-surrender" class="hidden">
    <div class="page-title">
      <h2>解約文件</h2>
    </div>
    <p class="page-sub">目前各公司的解約申請，已包含在「契變」分頁的契約變更申請書中，請先到契變分頁下載。獨立的解約文件整理好後會放在這裡。</p>
    <p><button type="button" class="doc-go" onclick="showPage('endorse')">前往契變文件 →</button></p>
  </section>
</main>

<footer>請下載後確認為最新版本文件</footer>

<script>
  // 20 家壽險公司資料
  // filename 對應各自資料夾中的檔案，請將實際 PDF 檔案放入對應資料夾並改成對應檔名
  const claimCompanies = [
    { name:"國泰人壽(含國寶、幸福)", file:"cathay.pdf" },
    { name:"富邦人壽(含ING安泰、喬治亞、花旗)", file:"fubon.pdf" },
    { name:"南山人壽(含朝陽、興農)", file:"nanshan.pdf" },
    { name:"新光人壽(含保德信、台新)", file:"shinkong.pdf" },
    { name:"台灣人壽(含中國信託、大都會)", file:"taiwanlife.pdf" },
    { name:"三商美邦人壽", file:"massmutual.pdf" },
    { name:"全球人壽(含國華、全美)", file:"tglife.pdf" },
    { name:"保誠人壽", file:"prudential.pdf" },
    { name:"遠雄人壽(含蘇黎世、中興)", file:"farglory.pdf" },
    { name:"元大人壽(含紐約)", file:"yuanta.pdf" },
    { name:"安聯人壽(含匯豐、統一)", type:"link", link:"https://www.allianz.com.tw/zh_TW/download-zone/claim-forms.html" },
    { name:"第一金人壽(含第一英傑華)", file:"firstlife.pdf" },
    { name:"合作金庫人壽", file:"tacoop.pdf" },
    { name:"台銀人壽(含中央)", file:"botlife.pdf" },
    { name:"宏泰人壽", file:"hontai.pdf" },
    { name:"中華郵政壽險", file:"postlife.pdf" },
    { name:"凱基人壽(含中國、保誠、慶豐、第一、瑞泰、華僑)", file:"kgi.pdf" },
    { name:"友邦人壽(含美國)", file:"aia.pdf" },
    { name:"安達人壽(含康健、中泰)", file:"chubb.pdf" },
    { name:"法國巴黎人壽", file:"cardi.pdf" },
    { name:"富邦產物車險", file:"fuboncar.pdf" },
    { name:"富邦產物個險/旅平險", file:"fubonper.pdf"},
  ];

  // 契變頁跟理賠頁同一批公司，檔案放在 pdfs-endorse/ 資料夾（跟理賠的 pdfs/ 分開，避免檔名互相覆蓋）
  const endorseCompanies = [
    { name:"國泰人壽(含國寶、幸福)", file:"國泰人壽契變書.pdf" },
    { name:"富邦人壽(含ING安泰、喬治亞、花旗)", file:"富邦人壽契變書.pdf" },
    { name:"南山人壽(含朝陽、興農)", file:"南山人壽契變書.pdf" },
    { name:"新光人壽(含保德信、台新)", file:"新光台新契變書.pdf" },
    { name:"台灣人壽(含中國信託、大都會)", file:"台灣人壽契變書.pdf" },
    { name:"三商美邦人壽", file:"三商美邦契變書.pdf" },
    { name:"全球人壽(含國華、全美)", file:"全球人壽契變書.pdf" },
    { name:"保誠人壽", file:"保誠人壽契變書.pdf" },
    { name:"遠雄人壽(含蘇黎世、中興)", file:"遠雄人壽契變書.pdf" },
    { name:"元大人壽(含紐約)", type:"link", link:"https://www.yuantalife.com.tw/our-services/form/catalog/" },
    { name:"安聯人壽(含匯豐、統一)", type:"link", link:"https://www.allianz.com.tw/zh_TW/download-zone/policy-changing-forms.html" },
    { name:"第一金人壽(含第一英傑華)", file:"第一金人壽契變書.pdf" },
    { name:"合作金庫人壽", file:"合作金庫契變書.pdf" },
    { name:"台銀人壽(含中央)", file:"台銀人壽契變書.pdf" },
    { name:"宏泰人壽", file:"宏泰人壽契變書.pdf" },
    { name:"中華郵政壽險", file:"中華郵政契變書.pdf" },
    { name:"凱基人壽(含中國、保誠、慶豐、第一、瑞泰、華僑)", file:"凱基人壽契變書.pdf" },
    { name:"友邦人壽(含美國)", file:"友邦人壽契變書.pdf" },
    { name:"安達人壽(含康健、中泰)", file:"安達人壽契變書.pdf" },
    { name:"法國巴黎人壽", type:"link", link:"https://life.cardif.com.tw/a311" },
    { name:"富邦產物車險", file:"富產車險契變書.pdf" },
  ];

  // 產生一組文件下載卡片網格。folder：PDF 所在資料夾／docLabel：按鈕文字用的文件類型名稱／docSuffix：下載檔名後綴
  function renderGrid(companies, gridEl, { folder, docLabel, docSuffix }) {
    companies.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';

      const idx = document.createElement('div');
      idx.className = 'idx';
      idx.textContent = String(i+1).padStart(2,'0');

      const h3 = document.createElement('h3');
      h3.textContent = c.name;

      const isLink = c.type === 'link';
      const btn = document.createElement('button');
      btn.className = 'dl-btn';
      btn.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        ${isLink ? `前往${docLabel}文件` : `下載${docLabel}文件`}
        <span class="stamp">${isLink ? '已開啟' : '已下載'}</span>
      `;

      const note = document.createElement('div');
      note.className = 'status-note';

      btn.addEventListener('click', () => {
        if (isLink) {
          // 直接導向該連結（開新分頁）
          window.open(c.link, '_blank');
        } else {
          // 觸發下載
          const a = document.createElement('a');
          a.href = folder + '/' + c.file;
          a.download = c.name + docSuffix;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }

        // 蓋章動畫
        btn.classList.remove('stamped');
        void btn.offsetWidth; // reflow 以重新觸發動畫
        btn.classList.add('stamped');

        note.textContent = isLink
          ? '已於 ' + new Date().toLocaleTimeString('zh-TW', {hour12:false}) + ' 開啟連結'
          : '已於 ' + new Date().toLocaleTimeString('zh-TW', {hour12:false}) + ' 下載';
      });

      card.appendChild(idx);
      card.appendChild(h3);
      card.appendChild(btn);
      card.appendChild(note);
      gridEl.appendChild(card);
    });
  }

  renderGrid(claimCompanies, document.getElementById('claim-grid'), {
    folder: 'pdfs', docLabel: '理賠', docSuffix: '_理賠申請書.pdf',
  });
  renderGrid(endorseCompanies, document.getElementById('endorse-grid'), {
    folder: 'pdfs-endorse', docLabel: '契變', docSuffix: '_契約變更申請書.pdf',
  });

  function showPage(which){
    ['claim', 'endorse', 'surrender'].forEach((k) => {
      document.getElementById('page-' + k).classList.toggle('hidden', which !== k);
      document.getElementById('tab-' + k).classList.toggle('active', which === k);
    });
    if (location.hash !== '#' + which) history.replaceState(null, '', '#' + which);
  }

  // 網址帶 #endorse／#surrender 直接開對應分頁（子頁面連回來用）
  const want = location.hash.slice(1);
  if (['endorse', 'surrender'].includes(want)) showPage(want);
</script>
<!-- 文件下載需要登入；沒登入直接打開首頁的訪客導去財經日報（免費開放） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js?v=20261120-2"></script>
<script src="shared/auth.js?v=20261126-2"></script>
<script>
  (async () => {
    const { data } = await sb.auth.getSession();
    if (!data.session && !location.hash) { location.replace('market/index.html'); return; }
    await requireLogin('', { allowPortal: true });
    document.getElementById('docs-main').hidden = false;
  })();
</script>
</body>
</html>
