<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../shared/theme-tokens.css?v=20261116-1">
<script src="../shared/theme.js?v=20261123-1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>我的保單｜東石家族辦公室</title>
<link rel="icon" href="../favicon.ico?v=3" sizes="any">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="../shared/site-header.css?v=20261127-1">
<link rel="stylesheet" href="../shared/auth.css?v=20261116-1">
<link rel="stylesheet" href="my.css?v=20261123-3">
</head>
<body class="auth-page">

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <img class="ghdr-mark" src="../icons/logo.png?v=3" alt="東石家族辦公室">
    <div>
      <div class="ghdr-title">東石家族辦公室</div>
      <div class="ghdr-sub">我的保單</div>
    </div>
  </div>
  <div class="ghdr-tools"><nav class="role-switch" aria-label="登入身分"><a href="../login.html">業務員登入</a><a href="index.html" class="active">客戶登入</a></nav></div>
</div>

<main id="app">
  <!-- 登入 -->
  <form class="auth-card" id="v-login" hidden>
    <div class="auth-title">客戶登入</div>
    <label>手機號碼<input type="text" id="li-email" inputmode="tel" autocomplete="username" placeholder="09xxxxxxxx" required></label>
    <label>密碼<input type="password" id="li-pass" autocomplete="current-password" required></label>
    <div class="auth-msg" id="li-msg"></div>
    <button type="submit" class="auth-btn auth-btn-block">登入</button>
    <p class="auth-note">第一次使用？<a href="#" id="to-signup">用邀請碼註冊</a>　｜　<a href="#" id="to-forgot">忘記密碼</a></p>
  </form>

  <!-- 註冊 -->
  <form class="auth-card" id="v-signup" hidden>
    <div class="auth-title">註冊查看我的保單</div>
    <label>邀請碼<input type="text" id="su-code" required autocomplete="off" placeholder="由您的業務員提供" style="text-transform:uppercase"></label>
    <label>手機號碼（要和業務員登記的一樣）<input type="tel" id="su-email" inputmode="tel" autocomplete="username" placeholder="09xxxxxxxx" required></label>
    <label>設定密碼（至少 8 碼）<input type="password" id="su-pass" autocomplete="new-password" minlength="8" required></label>
    <div class="auth-msg" id="su-msg"></div>
    <button type="submit" class="auth-btn auth-btn-block">註冊</button>
    <p class="auth-note">已經有帳號？<a href="#" id="to-login">直接登入</a></p>
  </form>

  <!-- 忘記密碼 -->
  <form class="auth-card" id="v-forgot" hidden>
    <div class="auth-title">重設密碼</div>
    <p class="auth-note" style="margin-top:0">用手機註冊的帳號：請向您的業務員索取新的邀請碼，回到「用邀請碼註冊」，輸入同一支手機和新密碼，就會改成新密碼。</p>
    <label>以前用電子信箱註冊的，請輸入信箱<input type="email" id="fg-email" autocomplete="username" required></label>
    <div class="auth-msg" id="fg-msg"></div>
    <button type="submit" class="auth-btn auth-btn-block">寄送重設信</button>
    <p class="auth-note"><a href="#" class="back-login">回到登入</a></p>
  </form>

  <!-- 設定新密碼（從重設信點回來） -->
  <form class="auth-card" id="v-reset" hidden>
    <div class="auth-title">設定新密碼</div>
    <label>新密碼（至少 8 碼）<input type="password" id="rs-pass" autocomplete="new-password" minlength="8" required></label>
    <div class="auth-msg" id="rs-msg"></div>
    <button type="submit" class="auth-btn auth-btn-block">儲存新密碼</button>
  </form>

  <!-- 已登入但還沒綁定 -->
  <form class="auth-card" id="v-bind" hidden>
    <div class="auth-title">輸入邀請碼</div>
    <p class="auth-note" style="margin-top:0">請輸入業務員提供的邀請碼，完成後就能看到您的保單。</p>
    <label>邀請碼<input type="text" id="bd-code" required autocomplete="off" style="text-transform:uppercase"></label>
    <div class="auth-msg" id="bd-msg"></div>
    <button type="submit" class="auth-btn auth-btn-block">確認</button>
    <p class="auth-note"><a href="#" class="do-logout">登出</a></p>
  </form>

  <!-- 保單 -->
  <section id="v-list" class="my-wrap" hidden>
    <div class="my-head">
      <div><h1 id="my-name"></h1><div class="my-sub">保單資料僅供查閱，實際內容以保險公司保單為準。</div></div>
      <div class="my-actions">
        <a class="my-line" id="my-line" target="_blank" rel="noopener">LINE 聯繫東石</a>
        <button type="button" class="my-out do-logout">登出</button>
      </div>
    </div>
    <div id="my-reports"></div>
    <div id="my-policies"></div>
    <p class="my-foot">保單資料有誤、需要理賠或契約變更，請點上方「LINE 聯繫東石」，我們會盡快協助您。</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../shared/supabase-client.js?v=20261120-2"></script>
<script src="my.js?v=20261126-9"></script>
</body>
</html>
