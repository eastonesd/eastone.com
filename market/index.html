<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>財經日報 | 即時財經資訊</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="財經日報">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <div style="text-align:center; margin-bottom:14px;">
    <a href="../index.html" style="color:var(--gold); font-size:.85rem; text-decoration:none; letter-spacing:1px;">← 理賠文件首頁</a>
  </div>

  <header class="masthead">
    <h1 class="title">財經日報</h1>
    <h2 class="subtitle" id="today-date">News</h2>
  </header>

  <section class="section">
    <h3 class="section-title">匯率觀測站</h3>
    <div class="card-grid rates-grid" id="rates-grid">
      <div class="card" data-key="美元"><span class="card-label">美元</span><span class="card-value">--</span></div>
      <div class="card" data-key="澳幣"><span class="card-label">澳幣</span><span class="card-value">--</span></div>
      <div class="card" data-key="日幣"><span class="card-label">日幣</span><span class="card-value">--</span></div>
      <div class="card" data-key="人民幣"><span class="card-label">人民幣</span><span class="card-value">--</span></div>
    </div>
    <p class="update-note">每 60 秒自動更新 <span id="rates-updated"></span></p>
  </section>

  <section class="section">
    <h3 class="section-title">五大重點財經頭條</h3>
    <ul class="news-list" id="news-list">
      <li class="news-item skeleton">讀取新聞中...</li>
    </ul>
    <p class="update-note">每 60 秒自動更新 <span id="news-updated"></span></p>
  </section>

  <section class="section">
    <h3 class="section-title">重要指數</h3>
    <p class="news-item skeleton" style="border-radius:8px;">指數功能尚未開放（Yahoo Finance 不開放瀏覽器直接讀取，之後接上合適的行情 API 後會補上）</p>
  </section>

  <footer class="footer">
    <p>打造你的每日財經速覽</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
