<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>財經日報 | 即時財經資訊</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="財經日報">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

  <div style="text-align:center; margin-bottom:14px;">
    <a href="../index.html" style="color:var(--gold); font-size:.85rem; text-decoration:none; letter-spacing:1px;">← 理賠文件首頁</a>
  </div>

  <header class="masthead">
    <h1 class="title">財經日報</h1>
    <h2 class="subtitle" id="today-date">News</h2>
  </header>

  <section class="section">
    <h3 class="section-title">即時匯率</h3>
    <div class="card-grid rates-grid" id="rates-grid">
      <div class="card" data-key="美元"><span class="card-label">美元</span><span class="card-value">--</span></div>
      <div class="card" data-key="澳幣"><span class="card-label">澳幣</span><span class="card-value">--</span></div>
      <div class="card" data-key="日幣"><span class="card-label">日幣</span><span class="card-value">--</span></div>
      <div class="card" data-key="人民幣"><span class="card-label">人民幣</span><span class="card-value">--</span></div>
    </div>
  </section>

  <section class="section">
    <h3 class="section-title">財經頭條</h3>
    <ul class="news-list" id="news-list">
      <li class="news-item skeleton">讀取新聞中...</li>
    </ul>
  </section>

  <section class="section">
    <h3 class="section-title">重要指數</h3>
    <div class="card-grid indices-grid" id="indices-grid">
      <div class="card" data-key="dji"><span class="card-label">道瓊</span><span class="card-value price">--</span><span class="card-change"></span><span class="card-time"></span></div>
      <div class="card" data-key="spx"><span class="card-label">標普500</span><span class="card-value price">--</span><span class="card-change"></span><span class="card-time"></span></div>
      <div class="card" data-key="ixic"><span class="card-label">那斯達克</span><span class="card-value price">--</span><span class="card-change"></span><span class="card-time"></span></div>
      <div class="card" data-key="twii"><span class="card-label">台指</span><span class="card-value price">--</span><span class="card-change"></span><span class="card-time"></span></div>
    </div>
  </section>

  <footer class="footer">
    <p>打造你的每日財經速覽</p>
    <p>東石系統，打造堅若磐石的家庭金融</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
