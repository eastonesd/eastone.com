<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>東石保險服務平台</title>
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="車險管理">
<link rel="stylesheet" href="../shared/site-header.css?v=20261113-3">
<link rel="stylesheet" href="../shared/auth.css?v=20261113-3">
<link rel="stylesheet" href="style.css?v=20261113-3">
</head>
<body>

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <img class="ghdr-mark" src="../icons/logo.png" alt="東石保險服務平台">
    <div>
      <div class="ghdr-title">東石保險服務平台</div>
      <div class="ghdr-sub">EASTONE INSURANCE</div>
    </div>
  </div>
  <nav class="ghdr-nav">
    <button onclick="location.href='../index.html'">理賠</button>
    <button onclick="location.href='../index.html#endorse'">契變</button>
    <button onclick="location.href='../market/index.html'">財經日報</button>
    <button onclick="location.href='../clients/index.html'">客戶資料</button>
    <button class="active" onclick="location.href='index.html'">產險管理</button>
  </nav>
</div>

<div class="app-header">
  <div class="brand">保單建檔<small>VEHICLE INSURANCE INTAKE</small></div>
  <div class="tag mono" id="stepTag">STEP 01 / 10</div>
</div>

<div class="top-nav">
  <a href="#" id="navForm" class="active">新增建檔</a>
  <a href="#" id="navList">已建檔案列表</a>
</div>

<div class="rail" id="rail"></div>

<!-- FORM WIZARD -->
<div id="wizardWrap">
  <form class="card" id="wizardCard" onsubmit="return false;"></form>
</div>

<!-- RECORDS LIST -->
<div class="table-wrap" id="listWrap" style="display:none;">
  <div class="card" style="max-width:none;">
    <div class="list-head">
      <div class="step-title">已建檔案</div>
      <div class="list-actions">
        <button type="button" class="btn-outline" id="btnExportBackup">匯出備份</button>
        <button type="button" class="btn-outline" id="btnImportBackup">匯入復原</button>
        <input type="file" id="importFileInput" accept="application/json" style="display:none;">
      </div>
    </div>
    <div id="recordsTableHolder">載入中...</div>
  </div>
</div>

<!-- RECORD DETAIL -->
<div class="table-wrap" id="detailWrap" style="display:none;">
  <div class="card" style="max-width:none;">
    <div class="nav-row" style="border:none; margin:0 0 16px; padding:0; justify-content:flex-start; gap:16px;">
      <button type="button" class="btn btn-ghost" id="btnBackToList">← 返回列表</button>
      <button type="button" class="btn btn-primary" id="btnEditRecord">編輯資料</button>
    </div>
    <div class="step-title">詳細資料</div>
    <div id="detailHolder"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../shared/supabase-client.js?v=20261113-3"></script>
<script src="../shared/auth.js?v=20261113-3"></script>
<script src="../shared/migrate-local.js?v=20261113-3"></script>
<script src="zipcodes.js?v=20261113-3"></script>
<script src="db.js?v=20261113-3"></script>
<script src="script.js?v=20261113-3"></script>
</body>
</html>
