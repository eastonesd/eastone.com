<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="shared/theme-tokens.css?v=20261116-1">
<script src="shared/theme.js?v=20261123-1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東石家族辦公室 登入</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="shared/site-header.css?v=20261126-1">
<link rel="stylesheet" href="shared/auth.css?v=20261116-1">
</head>
<body class="auth-page">

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <img class="ghdr-mark" src="icons/logo.png" alt="東石家族辦公室">
    <div>
      <div class="ghdr-title">東石家族辦公室</div>
      <div class="ghdr-sub">EASTONE FAMILY OFFICE</div>
    </div>
  </div>
  <nav class="ghdr-nav">
    <button onclick="location.href='index.html#claim'">文件下載</button>
    <button onclick="location.href='market/index.html'">財經日報</button>
    <button onclick="location.href='clients/index.html#filelist'">客戶管理</button>
    <button onclick="location.href='stock/index.html'">東石診股</button>
  </nav>
  <div class="ghdr-tools"><nav class="role-switch" aria-label="登入身分"><a href="login.html" class="active">業務員登入</a><a href="my/index.html">客戶登入</a></nav></div>
</div>

<main>
  <form class="auth-card" id="loginForm">
    <div class="auth-title">登入</div>
    <label>電子信箱
      <input type="email" id="email" autocomplete="username" required>
    </label>
    <label>密碼
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <div class="auth-msg" id="msg"></div>
    <button type="submit" class="auth-btn auth-btn-block" id="btnLogin">登入</button>
    <p class="auth-note">文件下載、客戶管理、東石診股需要登入才能使用；登入後會回到你剛剛的頁面。帳號由管理者建立，忘記密碼請聯絡管理者。</p>
    <p class="auth-note">您是保戶嗎？請到 <a href="my/index.html">我的保單</a> 登入或註冊。</p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="shared/supabase-client.js?v=20261120-2"></script>
<script>
  // 只允許導回系統內的這兩頁，避免被拿來當跳轉到外部網站的工具
  function safeNext() {
    const next = new URLSearchParams(location.search).get('next') || '';
    // 系統內的頁面才導回去（可帶 ?id=… 與 #分頁），其他一律回首頁
    // 東石診股（另一個 repo，同網域）登入後回到診股
    if (/^eastone\.stock\/index\.html/.test(next)) return '../eastone.stock/';
    return /^(index\.html|clients\/(index|policy|checkup|report|finance|tax)\.html|stock\/index\.html|policies\/index\.html|kb\/index\.html)(\?[\w=&%.-]*)?(#[\w=-]*)?$/.test(next) ? next : 'index.html';
  }

  // 已經登入的話直接進去
  sb.auth.getSession().then(({ data }) => {
    if (data && data.session) location.replace(safeNext());
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btnLogin');
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = '登入中...';
    try {
      const { error } = await sb.auth.signInWithPassword({
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
      });
      if (error) {
        msg.textContent = /invalid login credentials/i.test(error.message)
          ? '信箱或密碼錯誤'
          : /email not confirmed/i.test(error.message)
            ? '這個帳號還沒啟用，請聯絡管理者'
            : '登入失敗：' + error.message;
        return;
      }
      location.replace(safeNext());
    } catch (err) {
      msg.textContent = '無法連線到伺服器，請確認網路。如果系統超過一週沒人使用，可能需要到 Supabase 後台恢復專案。';
    } finally {
      btn.disabled = false;
      btn.textContent = '登入';
    }
  });
</script>
</body>
</html>
