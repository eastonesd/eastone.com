<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東石系統</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="客戶管理">
<link rel="stylesheet" href="../shared/site-header.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <div class="ghdr-mark">ES</div>
    <div>
      <div class="ghdr-title">東石系統</div>
      <div class="ghdr-sub">EASTONE SYSTEM</div>
    </div>
  </div>
  <nav class="ghdr-nav">
    <button onclick="location.href='../index.html'">理賠</button>
    <button onclick="location.href='../index.html#endorse'">契變</button>
    <button onclick="location.href='../policies/index.html'">車險管理</button>
    <button class="active" onclick="location.href='index.html'">客戶資料</button>
    <button onclick="location.href='../market/index.html'">財經日報</button>
  </nav>
</div>

<header class="topbar">
  <h1>客戶個資管理<small>CLIENT PROFILE MANAGEMENT</small></h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="wizard">＋ 新增客戶</button>
    <button class="tab-btn" data-tab="filelist">📁 檔案區</button>
    <button class="tab-btn" data-tab="codes">⚙ 保單代號維護</button>
  </nav>
</header>

<main>

  <!-- ============ 新增客戶精靈 ============ -->
  <section id="tab-wizard" class="tab-panel active">
    <div class="stepper">
      <span class="step-dot active" data-step="1">1 基本資料</span>
      <span class="step-dot" data-step="2">2 生日</span>
      <span class="step-dot" data-step="3">3 聯絡方式</span>
      <span class="step-dot" data-step="4">4 地址</span>
      <span class="step-dot" data-step="5">5 保單</span>
    </div>

    <form id="client-form" class="card">

      <!-- Step 1 -->
      <div class="step" data-step="1">
        <label>客戶ID
          <input type="text" id="f-id" maxlength="20" placeholder="輸入ID（自動轉為大寫）" required>
        </label>
        <label>姓名
          <input type="text" id="f-name" placeholder="請輸入姓名" required>
        </label>
        <label>性別</label>
        <div class="wheel-select" id="wheel-gender">
          <div class="wheel-track">
            <div class="wheel-item">男</div>
            <div class="wheel-item">女</div>
            <div class="wheel-item">其他</div>
          </div>
          <div class="wheel-highlight"></div>
        </div>
      </div>

      <!-- Step 2 -->
      <div class="step" data-step="2" hidden>
        <label>生日</label>
        <div class="wheel-group">
          <div class="wheel-select" id="wheel-year"><div class="wheel-track"></div><div class="wheel-highlight"></div></div>
          <div class="wheel-select" id="wheel-month"><div class="wheel-track"></div><div class="wheel-highlight"></div></div>
          <div class="wheel-select" id="wheel-day"><div class="wheel-track"></div><div class="wheel-highlight"></div></div>
        </div>
        <div class="auto-fields">
          <div class="auto-field"><span>星座</span><strong id="out-zodiac">—</strong></div>
          <div class="auto-field"><span>實際年齡</span><strong id="out-actual-age">—</strong></div>
          <div class="auto-field"><span>保險年齡</span><strong id="out-insurance-age">—</strong></div>
        </div>
      </div>

      <!-- Step 3 -->
      <div class="step" data-step="3" hidden>
        <label>電子信箱
          <div class="email-row">
            <input type="text" id="f-email-local" placeholder="帳號">
            <span>@</span>
            <select id="f-email-domain">
              <option value="gmail.com">gmail.com</option>
              <option value="yahoo.com.tw">yahoo.com.tw</option>
              <option value="kimo.com">kimo.com</option>
              <option value="icloud.com">icloud.com</option>
              <option value="outlook.com">outlook.com</option>
              <option value="hotmail.com">hotmail.com</option>
              <option value="__custom__">其他（自填）</option>
            </select>
            <input type="text" id="f-email-custom" placeholder="請輸入網域" hidden>
          </div>
        </label>
        <label>電話
          <input type="tel" id="f-phone" placeholder="請輸入電話">
        </label>
      </div>

      <!-- Step 4 -->
      <div class="step" data-step="4" hidden>
        <div class="addr-row">
          <label>郵遞區號
            <input type="text" id="f-zip" maxlength="3" placeholder="3碼郵遞區號">
          </label>
          <label>縣市
            <select id="f-city"><option value="">請選擇縣市</option></select>
          </label>
          <label>鄉鎮市區
            <select id="f-district"><option value="">請選擇鄉鎮市區</option></select>
          </label>
        </div>
        <label>完整地址
          <input type="text" id="f-address-detail" placeholder="請輸入路、街、巷、弄、號、樓">
        </label>
      </div>

      <!-- Step 5 -->
      <div class="step" data-step="5" hidden>
        <div class="policy-table-wrap">
          <table class="policy-table" id="policy-table">
            <thead>
              <tr><th>保單號碼</th><th>主約代號</th><th>險種名稱</th><th>幣別</th><th></th></tr>
            </thead>
            <tbody id="policy-tbody"></tbody>
          </table>
          <button type="button" id="btn-add-policy" class="btn-secondary">＋ 新增一筆保單</button>
        </div>
      </div>

      <div class="wizard-nav">
        <button type="button" id="btn-prev" class="btn-secondary" disabled>上一步</button>
        <button type="button" id="btn-next" class="btn-primary">下一步</button>
        <button type="submit" id="btn-submit" class="btn-primary" hidden>建檔</button>
      </div>
    </form>
  </section>

  <!-- ============ 檔案區 ============ -->
  <section id="tab-filelist" class="tab-panel">
    <div class="card">
      <input type="text" id="search-box" placeholder="搜尋 ID 或姓名...">
      <table class="file-list-table">
        <thead><tr><th>客戶ID</th><th>姓名</th><th>性別</th></tr></thead>
        <tbody id="file-list-body"></tbody>
      </table>
    </div>
  </section>

  <!-- ============ 保單代號維護 ============ -->
  <section id="tab-codes" class="tab-panel">
    <div class="card">
      <p class="hint">在此維護貴公司「主約英文代號」對應的險種名稱，建檔時輸入代號即自動帶出名稱。</p>
      <div class="code-add-row">
        <input type="text" id="code-input" placeholder="代號 (例如 WL)" maxlength="10">
        <input type="text" id="code-name-input" placeholder="險種名稱 (例如 終身壽險)">
        <button type="button" id="btn-add-code" class="btn-primary">新增/更新</button>
      </div>
      <table class="file-list-table">
        <thead><tr><th>代號</th><th>險種名稱</th><th></th></tr></thead>
        <tbody id="code-list-body"></tbody>
      </table>
    </div>
  </section>

</main>

<!-- ============ 客戶詳細資料 Modal ============ -->
<div id="detail-modal" class="modal-overlay" hidden>
  <div class="modal-box">
    <button class="modal-close" id="btn-close-modal">✕</button>
    <div id="detail-content"></div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="data.js"></script>
<script src="db.js"></script>
<script src="script.js"></script>
</body>
</html>
