<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../shared/theme-tokens.css?v=20261118-1">
<script src="../shared/theme.js?v=20261123-1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>家族｜東石家族辦公室</title>
<link rel="icon" href="../favicon.ico?v=2" sizes="any">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=2">
<link rel="stylesheet" href="../shared/site-header.css?v=20261126-2">
<link rel="stylesheet" href="../shared/auth.css?v=20261118-1">
<link rel="stylesheet" href="style.css?v=20261121-1">
<link rel="stylesheet" href="family.css?v=20261126-10">
</head>
<body data-cm="fo" data-cm-root="../">

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <img class="ghdr-mark" src="../icons/logo.png" alt="東石家族辦公室">
    <div>
      <div class="ghdr-title">東石家族辦公室</div>
      <div class="ghdr-sub">EASTONE FAMILY OFFICE</div>
    </div>
  </div>
  <nav class="ghdr-nav">
    <button onclick="location.href='../index.html#claim'">文件下載</button>
    <button onclick="location.href='../market/index.html'">財經日報</button>
    <button class="active" onclick="location.href='../clients/index.html#filelist'">客戶管理</button>
    <button onclick="location.href='../stock/index.html'">東石診股</button>
  </nav>
</div>

<header class="topbar">
  <h1>家族<small>FAMILY · RELATIONSHIP MAP</small></h1>
  <div class="topbar-right">
    <nav class="tabs life-tabs">
      <a class="tab-btn tab-link active" href="family.html">👪 家族</a>
      <a class="tab-btn tab-link" href="finance.html">💼 資產負債</a>
      <a class="tab-btn tab-link" href="tax.html">🧾 稅務規劃</a>
    </nav>
  </div>
</header>

<main class="fo-main">
  <aside class="card fo-side">
    <div class="fo-side-h"><b>家族清單</b><button type="button" class="btn-secondary fo-sm" id="fo-me">我的業務員資料</button><button type="button" class="btn-primary fo-sm" id="fo-new">＋ 新家族</button></div>
    <input type="search" id="fo-search" placeholder="搜尋家族或成員">
    <div id="fo-list"></div>
    <div class="fo-side-h fo-todo-h"><b>待整理</b></div>
    <div id="fo-todo"></div>
  </aside>
  <section class="fo-body">
    <div class="card fo-empty" id="fo-empty">選擇左邊的家族，或按「＋ 新家族」建立。<br><small>一個人可以同時屬於多個家族（例如娘家、婆家）；關係記在人與人之間，兩個家族會自動連在一起。</small></div>
    <div id="fo-detail" hidden>
      <div class="card fo-head">
        <div><h2 id="fo-name"></h2><div class="fo-sub" id="fo-meta"></div></div>
        <div class="fo-actions">
          <button type="button" class="btn-secondary fo-sm" id="fo-edit">編輯家族</button>
          <button type="button" class="btn-secondary fo-sm" id="fo-agents-btn">服務窗口</button>
        </div>
      </div>
      <div class="card">
        <div class="fo-sec-h"><b>關係網絡</b>
          <span class="fo-legend">○ 男　△ 女　□ 未填性別　<i class="lg-other"></i>其他家族成員 <i class="lg-multi"></i>跨多個家族　＝ 配偶</span>
          <label class="fo-chk"><input type="checkbox" id="fo-cross" checked>顯示跨家族連結</label>
          <button type="button" class="btn-secondary fo-sm" id="fo-zout">－</button><button type="button" class="btn-secondary fo-sm" id="fo-zin">＋</button><button type="button" class="btn-secondary fo-sm" id="fo-fit">原尺寸</button>
        </div>
        <div id="fo-graph"></div>
        <div class="fo-hint">依世代由上而下排列；顏色代表世代。點人物看摘要，圖太大可左右捲動或縮放。</div>
        <div id="fo-pop" class="fo-pop" hidden></div>
      </div>
      <div class="fo-grid">
        <div class="card">
          <div class="fo-sec-h"><b>成員</b><button type="button" class="btn-primary fo-sm" id="fo-add-member">＋ 加入成員</button></div>
          <div id="fo-members"></div>
        </div>
        <div class="card">
          <div class="fo-sec-h"><b>關係</b><button type="button" class="btn-primary fo-sm" id="fo-add-rel">＋ 新增關係</button></div>
          <div id="fo-rels"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="fo-modal" hidden>
  <div class="modal-box">
    <button type="button" class="modal-close" id="fo-modal-close" aria-label="關閉">×</button>
    <h3 id="fo-modal-title"></h3>
    <form id="fo-form" autocomplete="off"></form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../shared/supabase-client.js?v=20261120-2"></script>
<script src="../shared/auth.js?v=20261126-2"></script>
<script src="family.js?v=20261126-11"></script>
<script src="../shared/cm-nav.js?v=20261126-2"></script>
</body>
</html>
