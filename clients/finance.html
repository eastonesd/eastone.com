<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../shared/theme-tokens.css?v=20261118-1">
<script src="../shared/theme.js?v=20261123-1"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>資產負債｜東石家族辦公室</title>
<link rel="icon" href="../favicon.ico?v=3" sizes="any">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=3">
<link rel="stylesheet" href="../shared/site-header.css?v=20261127-1">
<link rel="stylesheet" href="../shared/auth.css?v=20261128-1">
<link rel="stylesheet" href="picker.css?v=20261118-1">
<link rel="stylesheet" href="style.css?v=20261121-1">
<link rel="stylesheet" href="finance.css?v=20261127-1">
</head>
<body data-cm="fo" data-cm-root="../">

<div class="ghdr-wrap">
  <div class="ghdr-brand">
    <img class="ghdr-mark" src="../icons/logo.png?v=3" alt="東石家族辦公室">
    <div>
      <div class="ghdr-title">東石家族辦公室</div>
      <div class="ghdr-sub">EASTONE FAMILY OFFICE</div>
    </div>
  </div>
  <nav class="ghdr-nav">
    <button onclick="location.href='../index.html#claim'">文件下載</button>
    <button onclick="location.href='../market/index.html'">財經日報</button>
    <button class="active" onclick="location.href='../clients/index.html#filelist'">客戶管理</button>
    <button onclick="location.href='../stock/index.html'">東石診股</button>
  </nav>
</div>

<header class="topbar">
  <h1>資產負債<small>ASSETS · LIABILITIES · CASH FLOW</small></h1>
  <div class="topbar-right">
    <nav class="tabs life-tabs">
      <a class="tab-btn tab-link" href="family.html">👪 家族</a>
      <a class="tab-btn tab-link active" href="finance.html">💼 資產負債</a>
      <a class="tab-btn tab-link" href="tax.html">🧾 稅務規劃</a>
      <a class="tab-btn tab-link" href="legacy.html">🏛 傳承規劃</a>
      <a class="tab-btn tab-link" href="retire.html">🌅 退休規劃</a>
      <a class="tab-btn tab-link" href="pension.html">🛡 社會保險</a>
      <a class="tab-btn tab-link" href="invest.html">📈 投資監控</a>
    </nav>
  </div>
</header>

<main class="fin-main">
  <!-- 客戶與基準日 -->
  <section class="card fin-bar">
    <div class="fin-bar-row">
      <label class="fin-client">客戶
        <input type="text" id="fin-client" data-pick="fin-client" placeholder="點選或輸入客戶姓名／ID" autocomplete="off">
      </label>
      <label>基準日<input type="date" id="fin-asof"></label>
      <input type="hidden" id="fin-from"><input type="hidden" id="fin-to">
    </div>
    <div class="fin-bar-actions">
      <span class="fin-status" id="fin-status"></span>
      <button type="button" class="btn-secondary fin-sm" id="fin-fx-btn">更新匯率</button>
      <button type="button" class="btn-secondary fin-sm" id="fin-fx-manual">手動匯率</button>
      <button type="button" class="btn-secondary fin-sm" id="fin-quote-btn">更新行情</button>
      <button type="button" class="btn-primary fin-sm" id="fin-snap-btn">存成報表</button>
    </div>
  </section>

  <div id="fin-empty" class="card fin-empty">請先在上方選擇一位客戶。<br><small>所有金額只存在您的帳號底下，其他業務員看不到。</small></div>

  <div id="fin-body" hidden>
    <div class="fin-tabs" role="tablist">
      <button type="button" class="fin-tab active" data-sec="overview">總覽</button>
      <button type="button" class="fin-tab" data-sec="assets">資產</button>
      <button type="button" class="fin-tab" data-sec="liabs">負債</button>
      <button type="button" class="fin-tab" data-sec="cash">收支日曆</button>
      <button type="button" class="fin-tab" data-sec="links">資金關聯</button>
      <button type="button" class="fin-tab" data-sec="snaps">報表紀錄</button>
    </div>
    <section class="card fin-sec" id="sec-overview"></section>
    <section class="card fin-sec" id="sec-assets" hidden></section>
    <section class="card fin-sec" id="sec-liabs" hidden></section>
    <section class="card fin-sec" id="sec-cash" hidden></section>
    <section class="card fin-sec" id="sec-links" hidden></section>
    <section class="card fin-sec" id="sec-snaps" hidden></section>
  </div>
</main>

<!-- 共用編輯視窗 -->
<div class="modal-overlay fin-modal" id="fin-modal" hidden>
  <div class="modal-box">
    <button type="button" class="modal-close" id="fin-modal-close" aria-label="關閉">×</button>
    <h3 id="fin-modal-title"></h3>
    <form id="fin-form" autocomplete="off"></form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="../shared/supabase-client.js?v=20261120-2"></script>
<script src="../shared/auth.js?v=20261128-1"></script>
<script src="data.js?v=20261118-1"></script>
<script src="db.js?v=20261127-1"></script>
<script src="picker.js?v=20261118-1"></script>
<script src="finance-calc.js?v=20261128-1"></script>
<script src="finance.js?v=20261128-3"></script>
<script src="../shared/cm-nav.js?v=20261127-2"></script>
</body>
</html>
