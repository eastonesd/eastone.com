<main class="tax-main lg-main" id="tax-main" hidden>
  <div class="card tax-card">
    <h2>客戶<small class="tax-h-sub">從資產負債帶入可投資資產與每月收支，其餘自行調整；按「儲存」會記住這位客戶的設定</small></h2>
    <div class="tax-import">
      <label>選擇客戶
        <input type="text" id="rt-client" data-pick="rt-client" placeholder="點選客戶" autocomplete="off">
      </label>
      <button type="button" class="btn-primary" id="rt-load">帶入資料</button>
    </div>
    <div id="rt-note"></div>
  </div>

  <div id="rt-body" hidden>
    <div class="card tax-card">
      <h2>基本假設</h2>
      <div class="rt-grid">
        <label>目前年齡<input type="number" id="rt-age" min="0" max="110" inputmode="numeric"></label>
        <label>預計退休年齡<input type="number" id="rt-retireAge" min="30" max="90" inputmode="numeric"></label>
        <label>規劃到幾歲<input type="number" id="rt-lifeAge" min="60" max="110" inputmode="numeric"></label>
        <label>投資報酬率（年 %）<input type="number" id="rt-ret" step="0.1" inputmode="decimal"></label>
        <label>通膨率（年 %）<input type="number" id="rt-infl" step="0.1" inputmode="decimal"></label>
        <label>目前可投資資產（萬）<input type="number" id="rt-assets" step="any" inputmode="decimal"></label>
      </div>
      <h2>收支（今天的幣值，每月）</h2>
      <div class="rt-grid">
        <label>退休前每月收入（萬）<input type="number" id="rt-monthlyIncome" step="any" inputmode="decimal"></label>
        <label>每月生活支出（萬）<input type="number" id="rt-monthlyExpense" step="any" inputmode="decimal"></label>
        <label>退休後支出為目前的（%）<input type="number" id="rt-retireRatio" step="1" inputmode="numeric"></label>
        <label>退休金每月（萬）<input type="number" id="rt-pension" step="any" inputmode="decimal" placeholder="勞保年金、國民年金等"></label>
        <label>退休金幾歲開始領<input type="number" id="rt-pensionAge" inputmode="numeric"></label>
        <label>退休時一次領（萬）<input type="number" id="rt-lumpSum" step="any" inputmode="decimal" placeholder="勞退個人專戶等"></label>
      </div>
      <h2>其他固定收入<small class="tax-h-sub">還本、年金險、租金等，從幾歲到幾歲</small></h2>
      <div id="rt-other"></div>
      <button type="button" class="btn-secondary fin-sm" id="rt-add-other">＋ 加一筆收入</button>
      <h2>未來大額支出<small class="tax-h-sub">子女教育、換屋、醫療長照等（今天的幣值）</small></h2>
      <div id="rt-bigs"></div>
      <button type="button" class="btn-secondary fin-sm" id="rt-add-big">＋ 加一筆支出</button>
      <div class="tax-actions"><span id="rt-saved" class="tax-note"></span><button type="button" class="btn-primary" id="rt-save">儲存這位客戶的設定</button></div>
    </div>
    <div class="card tax-card tax-result" id="rt-result"></div>
  </div>
  <p class="tax-foot">以固定報酬率與通膨率逐年估算，實際投資報酬會波動；退休金請以勞保局、勞動部試算為準。本頁為規劃參考，不構成投資建議。</p>
</main>
